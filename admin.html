<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Marcela Correa Turismo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; padding: 40px; }
        .admin-container { max-width: 1400px; margin: 0 auto; }
        .admin-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 24px; margin-bottom: 30px; }
        .admin-card { background: white; border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .admin-card h2 { margin-bottom: 20px; color: #1e293b; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #475569; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 14px; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }
        button { background: #10b981; color: white; border: none; padding: 12px 30px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn-danger { background: #ef4444; }
        .btn-warning { background: #f59e0b; }
        .btn-primary { background: #3b82f6; }
        .paquete-item { background: #f8fafc; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .paquete-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status { padding: 30px; text-align: center; background: #f1f5f9; border-radius: 16px; margin-top: 20px; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #e2e8f0; border-top-color: #10b981; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 24px; border-radius: 12px; z-index: 1000; }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-header">
        <h1><i class="fas fa-crown"></i> Panel de Administración</h1>
        <p>Gestiona todo el contenido de la web. Los cambios se publicarán automáticamente en el sitio estático.</p>
    </div>
    
    <div class="admin-card">
        <h2><i class="fas fa-heading"></i> Configuración del Header</h2>
        <div class="form-group">
            <label>Número de WhatsApp (sin +)</label>
            <input type="text" id="whatsappNumber" placeholder="5493624331702">
        </div>
        <div class="form-group">
            <label>Texto del Logo</label>
            <input type="text" id="logoText" placeholder="marcela<br><span>correa</span> turismo">
        </div>
        <div class="form-group">
            <label>URL del Logo</label>
            <input type="text" id="logoImage" placeholder="https://i.postimg.cc/4Nrd9zWM/logoturismo.jpg">
        </div>
    </div>
    
    <div class="admin-card">
        <h2><i class="fas fa-film"></i> Sección Hero</h2>
        <div class="form-group">
            <label><input type="checkbox" id="heroEnabled"> Habilitar Hero</label>
        </div>
        <div class="form-group">
            <label>Título</label>
            <input type="text" id="heroTitle" value="Viajá con <span>Marcela Correa</span><br>y descubrí el mundo">
        </div>
        <div class="form-group">
            <label>Subtítulo</label>
            <textarea id="heroSubtitle" rows="2">Paquetes exclusivos con salidas garantizadas desde Resistencia, Corrientes y Villa Ángela.</textarea>
        </div>
        <div class="form-group">
            <label>Imagen de fondo (URL)</label>
            <input type="text" id="heroImage" value="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800">
        </div>
    </div>
    
    <div class="admin-card">
        <h2><i class="fas fa-box"></i> Paquetes Turísticos</h2>
        <div id="paquetes-container"></div>
        <button onclick="agregarPaquete()" class="btn-primary"><i class="fas fa-plus"></i> Agregar paquete</button>
    </div>
    
    <div class="admin-card">
        <h2><i class="fas fa-check-circle"></i> Beneficios</h2>
        <div id="beneficios-container"></div>
        <button onclick="agregarBeneficio()" class="btn-primary"><i class="fas fa-plus"></i> Agregar beneficio</button>
    </div>
    
    <div class="admin-card">
        <h2><i class="fas fa-globe"></i> Footer</h2>
        <div class="form-group">
            <label>Texto de copyright</label>
            <input type="text" id="copyright" value="© 2026 Marcela Correa Turismo · #HacemosRealidadTuViaje">
        </div>
        <div id="footer-columnas-container"></div>
        <button onclick="agregarColumnaFooter()" class="btn-primary"><i class="fas fa-plus"></i> Agregar columna</button>
    </div>
    
    <div class="admin-card">
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button onclick="guardarCambios()" style="background: #10b981; padding: 15px 40px;"><i class="fas fa-save"></i> Guardar y Publicar</button>
            <button onclick="cargarDatos()" class="btn-warning"><i class="fas fa-sync"></i> Recargar</button>
        </div>
        <div id="status" class="status">
            <i class="fas fa-info-circle"></i> Listo para editar
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
    const SUPABASE_KEY = 'TU_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let datosActuales = {
        header: { whatsappNumber: "5493624331702", logoText: "marcela<br><span>correa</span> turismo", logoImage: "https://i.postimg.cc/4Nrd9zWM/logoturismo.jpg" },
        hero: { enabled: true, title: "Viajá con <span>Marcela Correa</span><br>y descubrí el mundo", subtitle: "Paquetes exclusivos...", backgroundImage: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800" },
        paquetes: [],
        beneficios: [],
        footer: { copyright: "© 2026 Marcela Correa Turismo", columnas: [] }
    };
    
    async function cargarDatos() {
        showStatus("Cargando datos...", "loading");
        const { data, error } = await supabase
            .from('website_content')
            .select('*')
            .eq('id', 1)
            .single();
        
        if (data && data.contenido) {
            datosActuales = data.contenido;
        } else {
            // Cargar paquetes de ejemplo
            datosActuales.paquetes = [
                { id: 1, nombre: "Buenos Aires Vip", precio: 199000, imagen: "https://images.unsplash.com/photo-1589308078059-be1415eab4c3", badge: "Próxima salida", incluye: ["Hotel 5*", "Desayunos"] },
                { id: 2, nombre: "Mendoza & Nieve", precio: 280000, imagen: "https://images.unsplash.com/photo-1533105079780-92b9be482077", badge: "Cupos reducidos", incluye: ["Bodegas", "Nieve"] }
            ];
            datosActuales.beneficios = [
                { icono: "fa-crown", titulo: "Experiencias premium", descripcion: "Hoteles de primera línea" },
                { icono: "fa-clock", titulo: "Coordinación 24/7", descripcion: "Asistencia permanente" }
            ];
            datosActuales.footer.columnas = [
                { titulo: "MC Turismo", enlaces: [{ texto: "Quiénes somos", url: "#" }] },
                { titulo: "Contacto", enlaces: [{ texto: "WhatsApp", url: "https://wa.me/5493624331702" }] }
            ];
        }
        
        renderizarFormularios();
        showStatus("✅ Datos cargados correctamente", "success");
    }
    
    function renderizarFormularios() {
        // Header
        document.getElementById('whatsappNumber').value = datosActuales.header.whatsappNumber || '';
        document.getElementById('logoText').value = datosActuales.header.logoText || '';
        document.getElementById('logoImage').value = datosActuales.header.logoImage || '';
        
        // Hero
        document.getElementById('heroEnabled').checked = datosActuales.hero.enabled;
        document.getElementById('heroTitle').value = datosActuales.hero.title || '';
        document.getElementById('heroSubtitle').value = datosActuales.hero.subtitle || '';
        document.getElementById('heroImage').value = datosActuales.hero.backgroundImage || '';
        
        // Footer
        document.getElementById('copyright').value = datosActuales.footer.copyright || '';
        
        // Paquetes
        const paquetesContainer = document.getElementById('paquetes-container');
        paquetesContainer.innerHTML = datosActuales.paquetes.map((p, idx) => `
            <div class="paquete-item">
                <div class="paquete-header">
                    <strong>${p.nombre}</strong>
                    <button onclick="eliminarPaquete(${idx})" class="btn-danger" style="padding: 5px 15px;">Eliminar</button>
                </div>
                <div class="form-group"><label>Nombre</label><input type="text" value="${p.nombre}" onchange="actualizarPaquete(${idx}, 'nombre', this.value)"></div>
                <div class="form-group"><label>Precio</label><input type="number" value="${p.precio}" onchange="actualizarPaquete(${idx}, 'precio', parseInt(this.value))"></div>
                <div class="form-group"><label>Imagen URL</label><input type="text" value="${p.imagen}" onchange="actualizarPaquete(${idx}, 'imagen', this.value)"></div>
                <div class="form-group"><label>Badge</label><input type="text" value="${p.badge}" onchange="actualizarPaquete(${idx}, 'badge', this.value)"></div>
                <div class="form-group"><label>Incluye (separado por comas)</label><input type="text" value="${p.incluye ? p.incluye.join(', ') : ''}" onchange="actualizarPaquete(${idx}, 'incluye', this.value.split(',').map(s=>s.trim()))"></div>
            </div>
        `).join('');
        
        // Beneficios
        const beneficiosContainer = document.getElementById('beneficios-container');
        beneficiosContainer.innerHTML = datosActuales.beneficios.map((b, idx) => `
            <div class="paquete-item">
                <div class="paquete-header">
                    <strong>${b.titulo}</strong>
                    <button onclick="eliminarBeneficio(${idx})" class="btn-danger" style="padding: 5px 15px;">Eliminar</button>
                </div>
                <div class="form-group"><label>Icono (clase FontAwesome)</label><input type="text" value="${b.icono}" onchange="actualizarBeneficio(${idx}, 'icono', this.value)"></div>
                <div class="form-group"><label>Título</label><input type="text" value="${b.titulo}" onchange="actualizarBeneficio(${idx}, 'titulo', this.value)"></div>
                <div class="form-group"><label>Descripción</label><input type="text" value="${b.descripcion}" onchange="actualizarBeneficio(${idx}, 'descripcion', this.value)"></div>
            </div>
        `).join('');
        
        // Footer columnas
        const footerContainer = document.getElementById('footer-columnas-container');
        footerContainer.innerHTML = datosActuales.footer.columnas.map((col, idx) => `
            <div class="paquete-item">
                <div class="paquete-header">
                    <strong>${col.titulo}</strong>
                    <button onclick="eliminarColumnaFooter(${idx})" class="btn-danger" style="padding: 5px 15px;">Eliminar</button>
                </div>
                <div class="form-group"><label>Título columna</label><input type="text" value="${col.titulo}" onchange="actualizarColumnaFooter(${idx}, 'titulo', this.value)"></div>
                <div class="form-group"><label>Enlaces (JSON)</label><textarea rows="3" onchange="actualizarColumnaFooter(${idx}, 'enlaces', JSON.parse(this.value))">${JSON.stringify(col.enlaces, null, 2)}</textarea></div>
            </div>
        `).join('');
    }
    
    function actualizarPaquete(idx, campo, valor) { datosActuales.paquetes[idx][campo] = valor; }
    function actualizarBeneficio(idx, campo, valor) { datosActuales.beneficios[idx][campo] = valor; }
    function actualizarColumnaFooter(idx, campo, valor) { datosActuales.footer.columnas[idx][campo] = valor; }
    function eliminarPaquete(idx) { datosActuales.paquetes.splice(idx, 1); renderizarFormularios(); }
    function eliminarBeneficio(idx) { datosActuales.beneficios.splice(idx, 1); renderizarFormularios(); }
    function eliminarColumnaFooter(idx) { datosActuales.footer.columnas.splice(idx, 1); renderizarFormularios(); }
    function agregarPaquete() { datosActuales.paquetes.push({ id: Date.now(), nombre: "Nuevo destino", precio: 199000, imagen: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800", badge: "Nuevo", incluye: [] }); renderizarFormularios(); }
    function agregarBeneficio() { datosActuales.beneficios.push({ icono: "fa-star", titulo: "Nuevo beneficio", descripcion: "Descripción" }); renderizarFormularios(); }
    function agregarColumnaFooter() { datosActuales.footer.columnas.push({ titulo: "Nueva columna", enlaces: [] }); renderizarFormularios(); }
    
    async function guardarCambios() {
        // Recoger datos de los inputs
        datosActuales.header.whatsappNumber = document.getElementById('whatsappNumber').value;
        datosActuales.header.logoText = document.getElementById('logoText').value;
        datosActuales.header.logoImage = document.getElementById('logoImage').value;
        datosActuales.hero.enabled = document.getElementById('heroEnabled').checked;
        datosActuales.hero.title = document.getElementById('heroTitle').value;
        datosActuales.hero.subtitle = document.getElementById('heroSubtitle').value;
        datosActuales.hero.backgroundImage = document.getElementById('heroImage').value;
        datosActuales.footer.copyright = document.getElementById('copyright').value;
        
        showStatus("📤 Guardando en Supabase...", "loading");
        
        // Guardar en Supabase
        const { error } = await supabase
            .from('website_content')
            .upsert({ id: 1, contenido: datosActuales, updated_at: new Date() });
        
        if (error) {
            showStatus("❌ Error: " + error.message, "error");
            return;
        }
        
        showStatus("✅ Contenido guardado. Disparando reconstrucción...", "success");
        
        // 🔥 DISPARAR WEBHOOK A VERCEL (para reconstruir el sitio)
        await dispararWebhook();
    }
    
    async function dispararWebhook() {
        // URL del webhook de Vercel (lo configuras en Vercel Dashboard)
        const VERCEL_DEPLOY_HOOK = 'https://api.vercel.com/v1/integrations/deploy/prj_XXXXXX/XXXXXXXX'; // ← TU WEBHOOK
        
        try {
            const response = await fetch(VERCEL_DEPLOY_HOOK, { method: 'POST' });
            if (response.ok) {
                showStatus("🚀 Reconstrucción iniciada en Vercel. El sitio se actualizará en 1-2 minutos.", "success");
            } else {
                showStatus("⚠️ Webhook falló, pero los datos están guardados. Reconstruye manualmente en Vercel.", "warning");
            }
        } catch(e) {
            console.log("Webhook no configurado. Reconstrucción manual necesaria.");
        }
    }
    
    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = `<i class="fas ${type === 'loading' ? 'fa-spinner fa-spin' : (type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle')}"></i> ${msg}`;
        statusDiv.style.background = type === 'success' ? '#d1fae5' : (type === 'error' ? '#fee2e2' : '#fef3c7');
    }
    
    cargarDatos();
</script>
</body>
</html>
